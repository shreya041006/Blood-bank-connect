<!DOCTYPE html>
<html>
<head>
    <title>Hospital Requests</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f4f4;
        }

        .header {
            background: #cc0000;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .status {
            font-weight: bold;
        }

        .pending { color: orange; }
        .approved { color: green; }
        .rejected { color: red; }

        .back {
            margin: 15px;
            display: inline-block;
            cursor: pointer;
            color: #cc0000;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>My Blood Requests</h2>
</div>

<span class="back" onclick="goBack()">⬅ Back to Dashboard</span>

<div class="container" id="requestsContainer">
    <p>Loading...</p>
</div>

<script>
// 🔙 Back button
function goBack() {
    window.location.href = "hospital.html";
}

// 📥 Load hospital requests
async function loadRequests() {
    const hospitalId = localStorage.getItem("user_id");


    try {
        const res = await fetch(`http://localhost:5000/requests/${hospitalId}`);
        const data = await res.json();

        let html = "";

        if (data.length === 0) {
            html = "<p>No requests found</p>";
        } else {
            data.forEach(req => {
                html += `
                    <div class="card">
                        <p><b>Patient Name:</b> ${req.name}</p>
                        <p><b>Blood Group:</b> ${req.blood_group}</p>
                        <p class="status ${req.status}">
                            Status: ${req.status}
                        </p>
                    </div>
                `;
            });
        }

        document.getElementById("requestsContainer").innerHTML = html;

    } catch (err) {
        console.error(err);
        document.getElementById("requestsContainer").innerHTML = "Error loading data";
    }
}

// load on page open
loadRequests();
</script>

</body>
</html>

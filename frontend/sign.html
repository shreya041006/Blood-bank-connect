<!DOCTYPE html>
<html>
<head>
    <title>BloodLink</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial;
            background: linear-gradient(to right, #ff4d4d, #ff9999);
        }

        .container {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 { color: #e60000; }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #e60000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover { background: #cc0000; }

        .link {
            color: blue;
            cursor: pointer;
            margin-top: 10px;
            display: block;
        }
    </style>
</head>

<body>

<div class="container">
    <h2 id="title">Signup</h2>

    <input type="text" id="name" placeholder="Name">
    <input type="text" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    

    <select id="role">
        <option value="hospital">Hospital</option>
        <option value="bloodbank">Blood Bank</option>
    </select>
    <input type="text" id="city" placeholder="City">
    <input type="text" id="state" placeholder="State">

    <button onclick="handleSubmit()">Signup</button>

    <span class="link" onclick="toggleMode()">Already have account? Login</span>
</div>

<script>
let isLogin = false;

// 🔁 Toggle between signup/login
function toggleMode() {
    isLogin = !isLogin;

    document.getElementById("title").innerText = isLogin ? "Login" : "Signup";
    document.querySelector("button").innerText = isLogin ? "Login" : "Signup";
    document.querySelector(".link").innerText = isLogin 
        ? "Create new account" 
        : "Already have account? Login";

    document.getElementById("name").style.display = isLogin ? "none" : "block";
    document.getElementById("role").style.display = isLogin ? "none" : "block";
}

// 🚀 Handle both signup + login
async function handleSubmit() {
    const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        role: document.getElementById("role").value,
        city: document.getElementById("city").value,
        state: document.getElementById("state").value
        
    };

    const url = isLogin 
        ? "http://localhost:5000/login"
        : "http://localhost:5000/signup";

    try {
        const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await res.json();

        if (res.ok) {
            alert(isLogin ? "Login successful ✅" : "Signup successful ✅");

            // 👉 redirect after login
            if (isLogin) {
                if (result.role === "hospital") {
                    window.location.href = "hospital.html";
                } else {
                    window.location.href = "bloodbank.html";
                }
            }

        } else {
            alert(result.message || "Error ❌");
        }

    } catch (err) {
        console.error(err);
        alert("Server not running ❌");
    }
}
</script>

</body>
</html>

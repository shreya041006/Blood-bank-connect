<!DOCTYPE html>
<html>
<head>
    <title>Blood Bank Dashboard</title>
    <style>
        body { margin: 0; font-family: Arial; }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: #cc0000;
            color: white;
            padding: 20px;
        }

        .sidebar h2 { margin-bottom: 30px; }

        .sidebar p {
            cursor: pointer;
            margin: 15px 0;
        }

        .main {
            flex: 1;
            padding: 20px;
            background: #f2f2f2;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin: 10px;
            display: inline-block;
            width: 200px;
            cursor: pointer; /* 👈 added */
        }
    </style>
</head>

<body>

<div class="container">
    <div class="sidebar">
        <h2>Blood Bank</h2>
        <p>Update Stock</p>
        <p onclick="go('view.html')">View Requests</p>
        <p>Logout</p>
    </div>

    <div class="main" id="mainContent">
        <h2>Dashboard</h2>

        <div class="card" onclick ="go('update.html')">Update Stock</div>
        <div class="card" onclick="go('view.html')">Incoming Requests</div>
    </div>
</div>

<script>
// function loadRequests was removed because it is unused here and points to wrong port

</script>
<script>
function go(page) {
    window.location.href = page;
}
</script>

</body>
</html>

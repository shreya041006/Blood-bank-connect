<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Blood - Hospital Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e60000;
            --primary-hover: #cc0000;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #6c757d;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 12px rgba(230, 0, 0, 0.2);
        }

        .header h2 {
            margin: 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .search-panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input, .input-group select {
            padding: 12px 16px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(230, 0, 0, 0.1);
        }

        .search-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            height: 46px;
        }

        .search-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(230, 0, 0, 0.2);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .result-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            border: 1px solid #f1f3f5;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--primary);
        }

        .result-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.08);
        }

        .bank-name {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 8px 0;
            color: var(--text-main);
        }

        .bank-location {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0 0 16px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stock-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(230, 0, 0, 0.1);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .request-btn {
            width: 100%;
            background: white;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .request-btn:hover {
            background: var(--primary);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            background: white;
            border-radius: 12px;
            border: 1px dashed #dee2e6;
        }

        .empty-state h3 {
            margin: 0 0 8px 0;
            color: var(--text-main);
        }
        
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Find Blood Inventory</h2>
        <a href="hospital.html" class="back-btn">
            <span>⬅</span> Back to Dashboard
        </a>
    </div>

    <div class="container">
        <div class="search-panel">
            <div class="input-group">
                <label for="city">City</label>
                <input type="text" id="city" placeholder="e.g. Mumbai">
            </div>
            
            <div class="input-group">
                <label for="state">State</label>
                <input type="text" id="state" placeholder="e.g. Maharashtra">
            </div>

            <div class="input-group">
                <label for="group">Blood Group</label>
                <select id="group">
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>

            <button class="search-btn" onclick="findBlood()" id="searchBtn">
                Search Inventory
            </button>
        </div>

        <div id="result" class="results-grid">
            <!-- Results will appear here -->
        </div>
    </div>

    <script>
        async function findBlood() {
            const city = document.getElementById("city").value.trim();
            const state = document.getElementById("state").value.trim();
            const group = document.getElementById("group").value;
            const btn = document.getElementById("searchBtn");

            if (!city || !state) {
                alert("Please enter both City and State to search.");
                return;
            }

            btn.classList.add("loading");
            btn.textContent = "Searching...";

            try {
                const res = await fetch(
                    `http://localhost:5000/search-blood?city=${encodeURIComponent(city)}&state=${encodeURIComponent(state)}&group=${encodeURIComponent(group)}`
                );

                if (!res.ok) throw new Error("Network response was not ok");
                
                const data = await res.json();
                const container = document.getElementById("result");

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state" style="grid-column: 1 / -1;">
                            <h3>No blood banks found</h3>
                            <p>Try searching in a different city or changing the blood group.</p>
                        </div>
                    `;
                    return;
                }

                let html = "";
                data.forEach(item => {
                    html += `
                        <div class="result-card">
                            <h3 class="bank-name">${item.name}</h3>
                            <p class="bank-location">📍 ${item.city}, ${item.state}</p>
                            <div class="stock-badge">
                                🩸 ${item.available} Units Available
                            </div>
                            <button class="request-btn" onclick="sendRequest(${item.id})">
                                Request Blood
                            </button>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (err) {
                console.error(err);
                alert("An error occurred while searching. Please ensure the server is running.");
            } finally {
                btn.classList.remove("loading");
                btn.textContent = "Search Inventory";
            }
        }

        async function sendRequest(bloodbank_id) {
            const hospital_id = localStorage.getItem("user_id");
            const group = document.getElementById("group").value;
            
            if (!hospital_id) {
                alert("Session expired. Please login again.");
                window.location.href = "login.html";
                return;
            }

            const quantity = prompt("Enter quantity required (in units):");

            if (!quantity || isNaN(quantity) || quantity <= 0) {
                if (quantity !== null) alert("Please enter a valid quantity.");
                return;
            }

            try {
                const res = await fetch("http://localhost:5000/request", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        hospital_id,
                        bloodbank_id,
                        blood_group: group,
                        quantity: parseInt(quantity, 10)
                    })
                });

                if (!res.ok) throw new Error("Failed to send request");

                const data = await res.text();
                alert(data);
                
            } catch (err) {
                console.error(err);
                alert("Error sending request. Please try again.");
            }
        }
    </script>
</body>
</html>

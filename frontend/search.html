<!DOCTYPE html>
<html>
<head>
    <title>Find Blood</title>
</head>
<body>

<h2>Search Blood</h2>

<select id="group">
    <option value="A+">A+</option>
    <option value="A-">A-</option>
    <option value="B+">B+</option>
    <option value="B-">B-</option>
    <option value="O+">O+</option>
    <option value="O-">O-</option>
    <option value="AB+">AB+</option>
    <option value="AB-">AB-</option>
</select>

<button onclick="findBlood()">Search</button>

<hr>

<div id="result"></div>

<script>
async function findBlood() {
    const user_id = localStorage.getItem("user_id"); // must be set after login
    const group = document.getElementById("group").value;

    if (!user_id) {
        alert("Please login first ❌");
        return;
    }

    try {
        const res = await fetch(
            `http://localhost:5000/nearest-blood?user_id=${user_id}&group=${group}`
        );

        const data = await res.json();

        console.log("DATA:", data);

        const container = document.getElementById("result");

        // ❌ no data
        if (data.length === 0) {
            container.innerHTML = "<p>No blood available ❌</p>";
            return;
        }

        // ✅ show data
        let html = "";

        data.forEach(item => {
            html += `
                <div style="border:1px solid black; padding:10px; margin:10px;">
                    <h3>${item.name}</h3>
                    <p>${item.city}, ${item.state}</p>
                    <p>Available: ${item[group.replace('+','_pos').replace('-','_neg')] || 'N/A'}</p>
                    
                    <button onclick="sendRequest(${item.id})">Request</button>
                </div>
            `;
        });

        container.innerHTML = html;

    } catch (err) {
        console.error(err);
        alert("Error fetching data ❌");
    }
}

// 🔥 send request
async function sendRequest(bloodbank_id) {
    const hospital_id = localStorage.getItem("user_id");
    const group = document.getElementById("group").value;

    const quantity = prompt("Enter quantity:");

    if (!quantity) return;

    const res = await fetch("http://localhost:5000/request", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            hospital_id,
            bloodbank_id,
            blood_group: group,
            quantity
        })
    });

    const data = await res.text();
    alert(data);
}
</script>

</body>
</html>

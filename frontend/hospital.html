<!DOCTYPE html>
<html>

<head>
    <title>Hospital Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: #e60000;
            color: white;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 30px;
        }

        .sidebar p {
            cursor: pointer;
            margin: 15px 0;
        }

        .main {
            flex: 1;
            padding: 20px;
            background: #f2f2f2;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin: 15px;
            display: inline-block;
            width: 250px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            vertical-align: top;
            text-align: left;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .card h3 {
            margin-top: 0;
            color: #e60000;
        }

        .dashboard-cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="sidebar">
            <h2>Hospital</h2>
            <p onclick="go('search.html')">Search Blood</p>
            <p onclick="go('hospital_requets.html')">My Requests</p>
            <p onclick="logout()">Logout</p>

        </div>

        <div class="main">
            <h2>Hospital Dashboard</h2>
            <p>Welcome to the Hospital Dashboard. Use the cards below or the sidebar to navigate.</p>

            <div class="dashboard-cards">
                <div class="card" onclick="go('search.html')">
                    <h3>Search Blood</h3>
                </div>
                <div class="card" onclick="go('hospital_requets.html')">
                    <h3>My Requests</h3>
                </div>
            </div>
        </div>
    </div>

    <script>
        function go(page) {
            window.location.href = page;
        }

        function logout() {
            localStorage.removeItem("user_id");
            window.location.href = "login.html";
        }
    </script>
</body>

</html>
